/* Layout v10: todo en una pantalla de móvil. Franja oscura (cabezote blanco) + zona clara con las 4 librerías en 2x2
   y los 5 enlaces agrupados en una tarjeta. Los espacios crecen con el alto de la pantalla (clamp + dvh) y el aire
   libre se reparte de forma pareja. Fondo de RECURSOS/FONDO-1.psd rehecho en CSS. Un solo tema, a propósito. */
:root{
  --line:#DEDEE2;
  --wine:#8F1D2C;
  --red:#FF3B3F;
  --card:#FFFFFF;
  --hover:#F3F3F5;
  --text:#0A0A0C;
  --text-soft:#46464C;
  --on-dark:#FFFFFF;
  --on-dark-soft:rgba(255,255,255,.74);
  --on-wine:#F5F5F7;
  --band:rgba(18,18,18,.928);      /* franja superior del PSD */
  --veil:rgba(255,255,255,.797);   /* veladura clara del PSD */
  --gutter-l:max(24px, env(safe-area-inset-left, 0px));
  --gutter-r:max(24px, env(safe-area-inset-right, 0px));
  --col:380px;
  --space:clamp(14px, 3dvh, 44px);   /* ritmo vertical: crece con el alto disponible */
  --font:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}

/* Franja oscura */
.band{
  background:var(--band); color:var(--on-dark);
  padding:clamp(20px, 4.4dvh, 72px) var(--gutter-r) clamp(14px, 3dvh, 52px) var(--gutter-l);
}
header{max-width:var(--col); margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:clamp(6px, 1.2dvh, 14px)}
.logo{width:clamp(88px, 13dvh, 128px); height:auto; display:block}
h1{margin:0; font-weight:400; font-size:.86rem; letter-spacing:.42em; text-transform:uppercase; padding-left:.42em; color:var(--on-dark)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.bio{margin:0; font-weight:300; font-size:.95rem; color:var(--on-dark-soft)}
.social{display:flex; gap:4px; margin:0; padding:0; list-style:none}
.social a{display:grid; place-items:center; width:40px; height:40px; border-radius:50%; color:var(--on-dark); transition:color .15s ease}
.social a:hover{color:var(--red)}
.social svg{width:20px; height:20px}

/* Zona clara: el aire sobrante se reparte arriba, entre bloques y abajo */
.veil{
  flex:1; background:var(--veil);
  display:flex; flex-direction:column; justify-content:space-evenly; gap:var(--space);
  padding:var(--space) var(--gutter-r) var(--space) var(--gutter-l);
}
.veil > *{width:100%; max-width:var(--col); margin:0 auto}
section{display:flex; flex-direction:column; gap:12px}
h2{margin:0; font-size:.7rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase}
ul{margin:0; padding:0; list-style:none}

/* Librerías 2x2 */
.stores{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
.stores li{display:flex}
.store{
  flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:clamp(8px, 1.6dvh, 18px);
  min-height:clamp(60px, 8.6dvh, 96px); padding:11px 14px; border-radius:12px;
  background:var(--wine); border:1px solid var(--wine); color:var(--on-wine); text-decoration:none;
  transition:border-color .15s ease;
}
.store:hover{border-color:var(--red)}
.store .top{display:flex; align-items:flex-start; justify-content:space-between}
.store .ic{width:20px; height:20px}
.store .arrow{width:16px; height:16px; color:var(--on-wine); transition:transform .15s ease}
.store:hover .arrow{transform:translateX(3px)}
.store strong{font-weight:500; font-size:.95rem; line-height:1.2}

/* Enlaces agrupados en una tarjeta, filas con línea fina */
.links{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.links li + li{border-top:1px solid var(--line)}
.link{
  display:flex; align-items:center; gap:12px; min-height:clamp(42px, 6dvh, 54px); padding:6px 16px;
  color:var(--text); text-decoration:none; font-size:.95rem; transition:background .15s ease;
}
.link:hover{background:var(--hover)}
.link .ic{flex:none; width:20px; height:20px; color:var(--text-soft)}
.link .t{flex:1; min-width:0}
.arrow{flex:none; width:15px; height:15px; color:var(--text-soft); transition:transform .15s ease, color .15s ease}
.link:hover .arrow{transform:translateX(3px); color:var(--red)}

a:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.links a:focus-visible{outline-offset:-3px}

/* Pantallas muy bajas (p. ej. iPhone SE con barras del navegador): se compacta sin perder aire */
@media (max-height:600px){
  .bio{display:none}
  .logo{width:80px}
  .band{padding-block:14px 8px}
  header{gap:6px}
  .social a{width:36px; height:36px}
  .store{min-height:54px; padding-block:9px; gap:6px}
  .link{min-height:40px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
